# Dependabot version updates.
#
# Security updates were already enabled on the repository (dependabot_security_updates),
# which is what raises the open alerts for transitive Maven and npm dependencies. Without
# this file Dependabot had no version-update configuration at all, so those advisories were
# reported but never turned into upgrade PRs.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Maven — a reactor build: the parent pom declares core and dist as modules.
  # Pointing at the root lets Dependabot follow transitive advisories (log4j-api,
  # plexus-utils, commons-lang3) up to whatever actually declares them.
  # ---------------------------------------------------------------------------
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build(deps)"
    groups:
      # One PR for routine bumps rather than a dozen single-dependency PRs.
      #
      # surefire is excluded on purpose. 3.6.0 discovers ZERO tests on the Linux CI
      # runner — surefire reports "Tests run: 0" and exits 0, so six PRs merged green
      # on an empty suite (issue #39). The same version runs all 188 tests locally, so
      # this only shows up on CI. It is pinned to 3.5.3 in core/pom.xml; do not let a
      # grouped bump reintroduce it without a CI run that shows a non-zero test count.
      maven-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        exclude-dependencies:
          - "org.apache.maven.plugins:maven-surefire-plugin"
      maven-security:
        applies-to: security-updates
        dependency-type: production

  # ---------------------------------------------------------------------------
  # npm — the Mineflayer integration test harness.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /mineflayer-tests
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        dependency-type: production

  # ---------------------------------------------------------------------------
  # GitHub Actions — the workflow files reference actions by tag, so a bump here
  # is what keeps them off deprecated runner runtimes (Node 20 warnings).
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch