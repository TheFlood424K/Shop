# Detect hardcoded secrets/passwords in string literals
rule:
  id: security-no-hardcoded-secrets
  language: java
  severity: ERROR
  message: "Hardcoded secret detected. Use environment variables or secure configuration instead."
  pattern: |
    $VAR = "$SECRET";
  abstract: false
  rule:
    kind: variable_declarator
    has:
      kind: string_literal
  fix: |
    $VAR = System.getenv("$SECRET_ENV");
