name: Build and Package

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pull-requests: write
  checks: write
  issues: write

jobs:
  build-and-test:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4.5.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Fix toolchains.xml vendor to 'any'
        run: |
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<toolchains>\n  <toolchain>\n    <type>jdk</type>\n    <provides>\n      <version>25</version>\n      <vendor>any</vendor>\n    </provides>\n    <configuration>\n      <jdkHome>%s</jdkHome>\n    </configuration>\n  </toolchain>\n</toolchains>\n' "$JAVA_HOME" > ~/.m2/toolchains.xml

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache dynmap/BlockProt artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/us/dynmap/dynmap-api
            ~/.m2/repository/com/github/spnda/BlockProt
          key: ${{ runner.os }}-opt-deps-${{ hashFiles('scripts/install-dynmap-api.sh', 'scripts/install-blockprot-api.sh') }}
          restore-keys: |
            ${{ runner.os }}-opt-deps-

      - name: Install Dynmap API (CI fallback)
        run: |
          chmod +x ./scripts/install-dynmap-api.sh
          ./scripts/install-dynmap-api.sh

      - name: Install BlockProt API (CI fallback)
        run: |
          chmod +x ./scripts/install-blockprot-api.sh
          ./scripts/install-blockprot-api.sh

  # Dependency submission job - submits the Maven dependency snapshot to GitHub.
  # Independent of build-and-test: it declares no `needs`, so it starts in
  # parallel on its own runner and does not affect the build/test wall clock.
  # Skipped on PRs from forks, whose GITHUB_TOKEN is read-only and cannot
  # submit a snapshot.
  dependency-submission:
    name: Dependency Submission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4.5.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Fix toolchains.xml vendor to 'any'
        run: |
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<toolchains>\n  <toolchain>\n    <type>jdk</type>\n    <provides>\n      <version>25</version>\n      <vendor>any</vendor>\n    </provides>\n    <configuration>\n      <jdkHome>%s</jdkHome>\n    </configuration>\n  </toolchain>\n</toolchains>\n' "$JAVA_HOME" > ~/.m2/toolchains.xml

      - name: Cache dynmap/BlockProt artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/us/dynmap/dynmap-api
            ~/.m2/repository/com/github/spnda/BlockProt
          key: ${{ runner.os }}-opt-deps-${{ hashFiles('scripts/install-dynmap-api.sh', 'scripts/install-blockprot-api.sh') }}
          restore-keys: |
            ${{ runner.os }}-opt-deps-

      - name: Install Dynmap API (dependency resolution needs it)
        run: |
          chmod +x ./scripts/install-dynmap-api.sh
          ./scripts/install-dynmap-api.sh

      - name: Install BlockProt API (dependency resolution needs it)
        run: |
          chmod +x ./scripts/install-blockprot-api.sh
          ./scripts/install-blockprot-api.sh

      # The action resolves dependencies itself via depgraph-maven-plugin, so
      # there is no separate dependency:tree step. Multi-module support (core,
      # dist) is built in as of v5. No -Drevision is passed: the POM declares
      # <revision> in <properties>, so Maven resolves ${revision} on its own.
      - name: Submit dependency snapshot
        uses: advanced-security/maven-dependency-submission-action@v6.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          maven-args: -B -nsu -ntp

