name: Build and Package

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

# Read-only by default. The only job that needs write access is the tag-push
# release, which opts in with its own `permissions:` block.
permissions:
  contents: read

# Without this, every new push to a PR branch queues another ~30 min run while
# the superseded one keeps burning a runner and can report stale results against
# the PR. Grouping per-ref lets PR runs self-cancel. main/tag runs are left
# alone so a release in progress is never cancelled by a later commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Read-only. This job runs on every PR and every main-branch push; the only
    # step needing write access (creating the GitHub Release) lives in the
    # separate publish-release job below, which is tag-gated and holds
    # contents: write. Every other run therefore needs no write scope at all.
    permissions:
      contents: read

    # Exposed so publish-release can name the artifact it downloads.
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The version comes from the POM's <revision> property and the commit
          # hash from github.sha, so nothing here reads git history. A shallow
          # clone is enough and is much faster.
          fetch-depth: 1

      # JDK 25, the toolchains.xml shim, Maven caching, and the Dynmap/BlockProt
      # jars all live in this shared action (see the comment in it for why).
      - name: Set up build environment
        uses: ./.github/actions/setup-build-env

      - name: Compute version with commit hash
        id: version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_HASH="${{ github.event.pull_request.head.sha }}"
          else
            COMMIT_HASH="${{ github.sha }}"
          fi
          COMMIT_HASH="${COMMIT_HASH:0:7}"

          CURRENT_VERSION=$(grep -m 1 "<revision>" pom.xml | sed 's/.*<revision>\(.*\)<\/revision>.*/\1/')
          NEW_VERSION="${CURRENT_VERSION}-${COMMIT_HASH}"

          echo "VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "JAR_FILENAME=Shop-${NEW_VERSION}.jar" >> "$GITHUB_ENV"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "jar_filename=Shop-${NEW_VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Build & Test (single Maven invocation)
        id: build
        run: |
          set +e
          start_time=$(date +%s)
          mvn -B -nsu -ntp -T 1C -Drevision=${{ env.VERSION }} \
            -Dmaven.javadoc.skip=true -Dmaven.source.skip=true \
            -Dmaven.compiler.fork=false \
            -DforkCount=2 -DreuseForks=true \
            -DfailIfNoTests=false \
            clean test package 2>&1 | tee build-test-output.log
          TEST_EXIT=${PIPESTATUS[0]}
          end_time=$(date +%s)
          BUILD_TIME=$((end_time - start_time))
          echo "test_exit_code=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}s" >> "$GITHUB_OUTPUT"

          # Always try to find the built JAR
          JAR_PATH=$(find . -name "Shop-*.jar" -path "*/target/*" 2>/dev/null | head -1)
          if [ -n "$JAR_PATH" ]; then
            echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
            echo "jar_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "jar_path=" >> "$GITHUB_OUTPUT"
            echo "jar_found=false" >> "$GITHUB_OUTPUT"
          fi

          # Exit on Maven's own status, never on JAR presence. A JAR is an artifact of a
          # previous phase, not proof the whole invocation succeeded, so keying the step's
          # status to it can only ever turn a red build green.
          exit $TEST_EXIT

      - name: Generate test summary
        if: always()
        id: test-report
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          import glob
          import os
          import sys
          from collections import defaultdict

          report_dir = "core/target/surefire-reports"

          passed = failed = skipped = total = 0
          all_details = []  # (classname, method, msg, status)

          if os.path.exists(report_dir):
              xml_files = glob.glob(os.path.join(report_dir, "TEST-*.xml"))
              print(f"Found {len(xml_files)} test report files", file=sys.stderr)
              for xml_file in xml_files:
                  try:
                      tree = ET.parse(xml_file)
                      root = tree.getroot()
                      classname = root.get("name", "Unknown")

                      for testcase in root.findall(".//testcase"):
                          failure = testcase.find("failure")
                          error = testcase.find("error")
                          skipped_elem = testcase.find("skipped")
                          method = testcase.get("name", "unknown")

                          if failure is not None:
                              failed += 1
                              total += 1
                              msg = (failure.text or "").strip()
                              msg = msg.split('\n')[0][:200]
                              all_details.append((classname, method, msg, "FAIL"))
                          elif error is not None:
                              failed += 1
                              total += 1
                              msg = (error.text or "").strip()
                              msg = msg.split('\n')[0][:200]
                              all_details.append((classname, method, msg, "ERROR"))
                          elif skipped_elem is not None:
                              skipped += 1
                              total += 1
                              skip_msg = skipped_elem.get("message", "")
                              if not skip_msg:
                                  skip_msg = (skipped_elem.text or "").strip()
                              if not skip_msg:
                                  for child in skipped_elem:
                                      if child.text:
                                          skip_msg = child.text.strip()
                                          break
                              if not skip_msg:
                                  skip_msg = "Skipped (no reason given)"
                              msg_short = skip_msg[:150] + ("..." if len(skip_msg) > 150 else "")
                              all_details.append((classname, method, msg_short, "SKIP"))
                          else:
                              passed += 1
                              total += 1
                  except Exception as e:
                      print(f"Warning: Failed to parse {xml_file}: {e}", file=sys.stderr)
          else:
              print("No surefire reports found!", file=sys.stderr)

          pct = int((passed / total * 100)) if total > 0 else 0
          bar_len = 24
          filled = int(bar_len * passed / total) if total > 0 else 0
          failed_filled = int(bar_len * failed / total) if total > 0 else 0
          skipped_filled = int(bar_len * skipped / total) if total > 0 else 0
          remaining = bar_len - filled - failed_filled - skipped_filled
          if remaining < 0:
              remaining = 0

          # Use text-based blocks that render in GitHub markdown
          bar = "█" * filled + "▓" * failed_filled + "░" * skipped_filled + "·" * remaining

          lines = []
          lines.append("## 🧪 Test Results")
          lines.append("")
          lines.append(f"**{passed} of {total} passed** ({pct}%)")
          lines.append("")
          lines.append(f"`{bar}`")
          lines.append("")

          if total > 0:
              lines.append("| | Count | Share |")
              lines.append("|---|------:|------:|")
              lines.append(f"| Passed | {passed} | {passed/total*100:.1f}% |")
              if failed > 0:
                  lines.append(f"| Failed | {failed} | {failed/total*100:.1f}% |")
              if skipped > 0:
                  lines.append(f"| Skipped | {skipped} | {skipped/total*100:.1f}% |")
              lines.append(f"| **Total** | **{total}** | 100% |")
              lines.append("")

          if failed > 0 or skipped > 0:
              lines.append("Legend: `█` passed · `▓` failed · `░` skipped · `·` not run")
              lines.append("")

          if all_details:
              lines.append("### 📋 Test Details (Failures & Skips)")
              lines.append("")
              lines.append("| Class | Method | Status | Message |")
              lines.append("|-------|--------|--------|---------|")

              class_groups = defaultdict(list)
              for classname, method, msg, status in all_details:
                  class_groups[classname].append((method, msg, status))

              for classname, methods in class_groups.items():
                  for method, msg, status in methods:
                      # Escape pipe characters and newlines for markdown table
                      msg_escaped = msg.replace('\n', '<br>').replace('|', '\\|')
                      status_emoji = "❌" if status == "FAIL" else ("💥" if status == "ERROR" else "⏭️")
                      lines.append(f"| {classname} | {method} | {status_emoji} {status} | {msg_escaped} |")

              lines.append("")

          with open("test-summary.md", "w") as f:
              f.write("\n".join(lines))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"passed={passed}\n")
              f.write(f"failed={failed}\n")
              f.write(f"skipped={skipped}\n")
              f.write(f"total={total}\n")
              f.write(f"test_exit_code={1 if failed > 0 else 0}\n")

          print("\n".join(lines))
          PYEOF

      - name: Create workflow summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          TEST_EXIT="${{ steps.test-report.outputs.test_exit_code }}"
          BUILD_TEST_EXIT="${{ steps.build.outputs.test_exit_code }}"
          JAR_PATH="${{ steps.build.outputs.jar_path }}"
          JAR_FOUND="${{ steps.build.outputs.jar_found }}"
          BUILD_TIME="${{ steps.build.outputs.build_time }}"

          {
            # Determine status based on build success (JAR produced) and test results
            # JAR_FOUND = true means build succeeded (compilation passed, artifact produced)
            if [ "$JAR_FOUND" = "true" ] && [ "$TEST_EXIT" = "0" ]; then
              echo "# ✅ Build & Tests Passed"
            elif [ "$JAR_FOUND" = "true" ] && [ "$TEST_EXIT" != "0" ]; then
              echo "# ⚠️ Build Passed, Tests Failed"
              echo ""
              echo "> Artifact was produced successfully but some tests failed."
            else
              echo "# ❌ Build Failed"
              echo ""
              echo "> No artifact was produced. Check compilation or test failures below."
              if [ -f "build-test-output.log" ]; then
                echo ""
                echo "### 🔍 Build Errors (last 50 lines)"
                echo ""
                echo '```'
                tail -n 50 build-test-output.log | grep -E "(ERROR|FAILURE|error:|cannot find symbol)" | head -n 20 || tail -n 20 build-test-output.log
                echo '```'
              fi
            fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Version** | \`${{ env.VERSION }}\` |"
            echo "| **Commit** | [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            if [ -n "$BUILD_TIME" ]; then
              echo "| **Build time** | ${BUILD_TIME}s |"
            fi
            echo ""

            if [ -f "test-summary.md" ]; then
              cat test-summary.md
            else
              echo "## 🧪 Test Results"
              echo ""
              echo "No test results available."
              echo ""
            fi

            # Download instructions are appended after the upload step, which knows
            # whether the artifact actually landed — see "Add artifact link" below.
            if [ "$JAR_FOUND" = "true" ] && [ -n "$JAR_PATH" ]; then
              echo "---"
              echo ""
            fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "[View this run on GitHub](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) · [PR #${{ github.event.number }}](https://github.com/${{ github.repository }}/pull/${{ github.event.number }})"
              echo ""
            else
              echo "[View this run on GitHub](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              echo ""
            fi
          } > build-summary.md
          cat build-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JAR as a workflow artifact
        # Runs for every push and PR, not just tags, so a build can be downloaded and
        # inspected without waiting for a release. Without this, PR and main-branch runs
        # produced a JAR that nothing could download — the job summary linked to a bare
        # run page instead.
        if: always() && steps.build.outputs.jar_found == 'true'
        uses: actions/upload-artifact@v7
        id: upload_jar
        with:
          name: shop-${{ steps.version.outputs.version }}
          path: ${{ steps.build.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Add artifact link to the job summary
        # Appended after the upload so it can state whether the artifact is actually
        # there. GitHub has no direct file URL for run artifacts — they are only ever
        # served as a zip from the run page's Artifacts section — so the honest thing to
        # do is link that section and name the artifact, rather than a link that looks
        # like a file download and isn't.
        if: always() && steps.build.outputs.jar_found == 'true'
        run: |
          if [ "${{ steps.upload_jar.outcome }}" = "success" ]; then
            {
              echo ""
              echo "### 📦 JAR"
              echo ""
              echo "\`${{ env.JAR_FILENAME }}\` (version \`${{ steps.version.outputs.version }}\`) uploaded as artifact **\`shop-${{ steps.version.outputs.version }}\`**."
              echo ""
              echo "[Download it from this run's Artifacts section](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts) — GitHub serves artifacts as a zip, so extract the JAR from it."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo ""
              echo "### 📦 JAR"
              echo ""
              echo "Artifact upload did not succeed (\`${{ steps.upload_jar.outcome }}\`). The built JAR is at \`${{ steps.build.outputs.jar_path }}\` inside the runner workspace."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Creating the GitHub Release needs contents: write. Keeping it in its own
  # tag-gated job means build-and-test never has to run with write scope, so
  # every PR and main-branch run executes read-only.
  publish-release:
    name: Publish Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download built JAR
        uses: actions/download-artifact@v8
        with:
          name: shop-${{ needs.build-and-test.outputs.version }}

      - name: Attach JAR to the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # dist/pom.xml sets <finalName>Shop-${project.version}</finalName> — capital S.
          # This glob used to be lowercase 'shop-*.jar', which matches nothing on a
          # case-sensitive Linux runner, so releases were shipping with no JAR attached.
          files: 'Shop-*.jar'
          fail_on_unmatched_files: true
          generate_release_notes: true
