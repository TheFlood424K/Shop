name: Build and Package

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        # Full history is required for the diff-cover git range comparison
        # and for the changelog commit-log between tags.
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v6.0.1
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    # setup-java writes vendor=Temurin but core/pom.xml requests vendor=any.
    # Overwrite with vendor=any so maven-toolchains-plugin can match the entry.
    - name: Fix toolchains.xml vendor to 'any'
      run: |
        printf '<?xml version="1.0" encoding="UTF-8"?>\n<toolchains>\n  <toolchain>\n    <type>jdk</type>\n    <provides>\n      <version>25</version>\n      <vendor>any</vendor>\n    </provides>\n    <configuration>\n      <jdkHome>%s</jdkHome>\n    </configuration>\n  </toolchain>\n</toolchains>\n' "$JAVA_HOME" > ~/.m2/toolchains.xml

    # Single combined cache for both the SpigotBuildTools working directory
    # and the installed Spigot/Bukkit Maven artifacts.
    - name: Cache Spigot build outputs and Maven artifacts
      uses: actions/cache@v6.1.0
      with:
        path: |
          ./SpigotBuildTools
          ~/.m2/repository/org/spigotmc
          ~/.m2/repository/org/bukkit
        key: ${{ runner.os }}-spigot-${{ hashFiles('buildMavenRepo.sh', 'buildMavenRepo.Dockerfile') }}
        restore-keys: |
          ${{ runner.os }}-spigot-

    - name: Compute version with commit hash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          COMMIT_HASH="${{ github.event.pull_request.head.sha }}"
        else
          COMMIT_HASH="${{ github.sha }}"
        fi
        COMMIT_HASH="${COMMIT_HASH:0:7}"

        CURRENT_VERSION=$(grep -m 1 "<revision>" pom.xml | sed 's/.*<revision>\(.*\)<\/revision>.*/\1/')
        NEW_VERSION="${CURRENT_VERSION}-${COMMIT_HASH}"

        echo "VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
        echo "JAR_FILENAME=shop-${NEW_VERSION}.jar" >> "$GITHUB_ENV"

    - name: Build Maven Repository
      run: |
        chmod +x ./buildMavenRepo.sh
        ./buildMavenRepo.sh

    - name: Install Dynmap API (CI fallback)
      run: |
        chmod +x ./scripts/install-dynmap-api.sh
        ./scripts/install-dynmap-api.sh

    - name: Install BlockProt API (CI fallback)
      run: |
        chmod +x ./scripts/install-blockprot-api.sh
        ./scripts/install-blockprot-api.sh

    # -ntp  suppresses artifact download progress lines (the main source of log noise).
    # -T 1C builds all Maven modules in parallel using one thread per CPU core.
    - name: Build
      run: mvn -B -nsu -ntp -T 1C -Drevision=${{ env.VERSION }} clean verify

    - name: Publish Test Results
      if: always() && hashFiles('**/target/surefire-reports/*.xml') != ''
      uses: dorny/test-reporter@v3.0.0
      continue-on-error: true
      with:
        name: JUnit Tests
        path: '**/target/surefire-reports/*.xml'
        reporter: java-junit
        fail-on-error: false
        fail-on-empty: false

    - name: Generate diff-cover report
      if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      run: |
        chmod +x ./scripts/run-diff-cover.sh
        ./scripts/run-diff-cover.sh "origin/${{ github.base_ref }}" ./scripts/diff-cover.md ./scripts/diff-cover.html
      continue-on-error: true

    - name: Upload Artifact
      id: upload-shop-jar
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ env.JAR_FILENAME }}
        path: '**/target/Shop-*.jar'
        compression-level: 0
        if-no-files-found: error

    - name: Upload diff-cover HTML artifact
      if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      id: upload-diff-cover-report
      uses: actions/upload-artifact@v7.0.1
      with:
        name: diff-cover-report.html
        path: scripts/diff-cover.html

    - name: Create workflow summary
      if: always()
      run: |
        STATUS="${{ job.status }}"
        JAR_URL="${{ steps.upload-shop-jar.outputs.artifact-url }}"
        DIFF_URL="${{ steps.upload-diff-cover-report.outputs.artifact-url }}"
        {
          if [ "$STATUS" = "success" ]; then
            echo "# Build Completed Successfully! 🎉"
          else
            echo "# Build Failed ❌"
          fi
          echo ""
          echo "**Version:** $VERSION"
          if [ -n "$DIFF_URL" ]; then
            echo "**Diff Cover:** [View report]($DIFF_URL)"
          fi
          echo ""
          if [ -n "$JAR_URL" ]; then
            echo "### Download Build"
            echo "⬇️ [$JAR_FILENAME]($JAR_URL)"
            echo ""
          fi
        } > build-summary.md
        cat build-summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Build Summary
      if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: marocchino/sticky-pull-request-comment@v3.0.5
      with:
        path: build-summary.md

    - name: Comment PR with JaCoCo Coverage Report
      if: always() && hashFiles('**/target/site/jacoco/jacoco.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: madrapps/jacoco-report@v1.8.0
      continue-on-error: true
      with:
        paths: |
          **/target/site/jacoco/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 0
        min-coverage-changed-files: 30
        title: Coverage Report
        update-comment: true
        pass-emoji: ':green_circle:'
        fail-emoji: ':small_orange_diamond:'

    # Only runs on tag pushes (v*).
    # 1. Generates a commit-log changelog between the previous tag and this one.
    # 2. Passes it to softprops via body_path for a rich release description.
    # 3. generate_release_notes: true appends GitHub's auto-generated PR list
    #    (categorised by .github/release.yml) below the commit log.
    - name: Generate changelog
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        CURRENT_TAG="${GITHUB_REF_NAME}"
        PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n 1)

        {
          echo "## What's Changed"
          echo ""
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "### Commits since ${PREVIOUS_TAG}"
            git log "${PREVIOUS_TAG}..HEAD" \
              --pretty=format:'- [`%h`](https://github.com/${{ github.repository }}/commit/%H) %s (%an)' \
              --no-merges
          else
            echo "### All Commits"
            git log HEAD \
              --pretty=format:'- [`%h`](https://github.com/${{ github.repository }}/commit/%H) %s (%an)' \
              --no-merges
          fi
          echo ""
          echo ""
          echo "**Full diff:** https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}"
        } > changelog.md

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3.0.3
      with:
        files: '**/target/Shop-*.jar'
        body_path: changelog.md
        generate_release_notes: true
        make_latest: true
