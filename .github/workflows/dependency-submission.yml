name: Dependency Submission

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  submit-maven:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Restore Maven repository cache
        id: restore-maven-cache
        uses: actions/cache/restore@v4.2.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-jdk25-mc26.2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-jdk25-mc26.2-

      - name: Compute version with commit hash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_HASH=${{ github.event.pull_request.head.sha }}
          else
            COMMIT_HASH=${{ github.sha }}
          fi
          COMMIT_HASH=${COMMIT_HASH:0:7}

          CURRENT_VERSION=$(grep -m 1 "<revision>" pom.xml | sed 's/.*<revision>\(.*\)<\/revision>.*/\1/')
          NEW_VERSION="${CURRENT_VERSION}-${COMMIT_HASH}"

          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Create Maven toolchains.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>25</version>
                <vendor>any</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Install Dynmap API (CI fallback)
        run: |
          chmod +x ./scripts/install-dynmap-api.sh
          ./scripts/install-dynmap-api.sh || true

      - name: Install BlockProt API (CI fallback)
        run: |
          chmod +x ./scripts/install-blockprot-api.sh
          ./scripts/install-blockprot-api.sh || true

      - name: Clean failed Maven caches
        run: |
          find ~/.m2/repository -name "*.lastUpdated" -delete
          find ~/.m2/repository -name "_remote.repositories" -delete

      - name: Submit Maven Dependencies
        uses: advanced-security/maven-dependency-submission-action@v6.0.1
        with:
          maven-args: "-B -U -Drevision=${{ env.VERSION }} -DskipTests"
