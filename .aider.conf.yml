# Aider configuration for Shop

# Load the standalone, canonical, scoped, and workflow guidance.
read:
  - AIDER_INSTRUCTIONS.md
  - .github/copilot-instructions.md
  - .github/instructions/core-java.instructions.md
  - .github/instructions/core-tests.instructions.md
  - .github/instructions/core-integrations.instructions.md
  - .github/instructions/maven-dependencies.instructions.md
  - .github/instructions/documentation.instructions.md
  - .github/instructions/github-actions.instructions.md
  - .github/skills/shop-plugin-development/SKILL.md

# Model and environment settings
model: auto
encode: utf-8

# Always diff before committing
diff: true

# Keep repository-specific requirements in the loaded guidance rather than duplicating them here.
system_prompt: >-
  Follow the loaded Shop repository guidance. Keep changes focused, never expose credentials
  or private server data, and validate with the documented Maven commands.
