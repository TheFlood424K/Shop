# Test-only override of GAMBLE_DISPLAY.yml
# The production version uses a PLAYER_HEAD with a PlayerProfile/skull-owner,
# which MockBukkit's SerializableMeta.deserialize() cannot handle (NPE in
# SkullMetaMock.deserialize -> PlayerProfileMock.deserialize when map is null).
# This test copy uses plain STONE so MockBukkit can deserialize it cleanly.
# The production copy in src/main/resources/GAMBLE_DISPLAY.yml is unchanged.

GAMBLE_DISPLAY:
  ==: org.bukkit.inventory.ItemStack
  v: 3955
  type: STONE
  meta:
    ==: ItemMeta
    meta-type: UNSPECIFIC
    display-name: '{"text":"Random Item!","italic":false,"underlined":true,"color":"gold","bold":true}'
